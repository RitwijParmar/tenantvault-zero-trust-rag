[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tenantvault"
version = "1.0.0"
description = "Zero-trust multi-tenant RAG with PostgreSQL row-level security and verifiable isolation receipts."
requires-python = ">=3.11"
dependencies = [
  "cryptography>=43,<46",
  "fastapi>=0.115,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.9,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "ruff>=0.8,<1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
"src/tenantvault/api.py" = ["B008"]

[tool.setuptools.packages.find]
where = ["src"]
